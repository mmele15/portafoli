<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Capçalera Minimalista - Estil Bloc</title>
<style>
:root {
--color-principal: #2c3e50;
--color-accent: #e67e22;
}
header {
border-bottom: 2px solid var(--color-principal);
}
.logo {
font-size: 1.5rem;
font-weight: bold;
color: var(--color-accent);
border: 2px solid var(--color-accent);
}
nav ul {
list-style: none;
margin-left: 2.5rem;
}
nav li {
margin-left: 1.5rem;
}
nav a {
color: var(--color-principal);
font-weight: bold;
font-size: 1.1rem;
}
.cercador {
margin-left: 2.5rem;
}
.cercador input {
border: 1px solid var(--color-principal);
font-size: 0.9rem;
}
</style>
</head>
<body>
<header>
<a href="/" class="logo">ELMEULOGO</a>
<nav>
<ul>
<li><a href="#inici">Inici</a></li>
<li><a href="#productes">Productes</a></li>
<li><a href="#contacte">Contacte</a></li>
</ul>
</nav>
<form class="cercador" role="search">
<label for="cerca-web">Cerca:</label>
<input type="search" id="cerca-web" name="q">
<button type="submit">Cerca</button>
</form>
</header>
</body>
</html>
