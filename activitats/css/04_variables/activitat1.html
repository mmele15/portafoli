<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Variables CSS</title>
<style>
:root {
--color-principal: #2e86de;
}
h1 {
color: var(--color-principal);
border-bottom: 2px solid var(--color-principal);
font-size: 3rem;
}
p {
font-size: 1.2rem;
margin-left: 2.5rem;
}
a {
color: var(--color-principal);
font-weight: bold;
text-decoration: none;
border: 1px solid var(--color-principal);
}
</style>
</head>
<body>
<h1>Explorant l'Espai</h1>
<p>Aquesta és una pàgina de prova per veure com funcionen les variables. Pots visitar la web de la <a href="https://www.nasa.gov">NASA</a>, aprendre sobre <a href="https://es.wikipedia.org/wiki/Marte_(planeta)">Mart</a> o simplement tornar a l' <a href="/">Inici</a>.</p>
</body>
</html>
