<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Mi Red Social</title>
</head>
<body>
<h1>Crea tu cuenta</h1>
<p>Únete a nuestra comunidad hoy mismo.</p>
<form action="/registro-usuario" method="POST" enctype="multipart/form-data">
<fieldset>
<legend>Información de la cuenta</legend>
<div>
<label for="username">Nombre de usuario (@):</label><br>
<input type="text" id="username" name="username" required>
</div>
<br>
<div>
<label for="email">Correo electrónico:</label><br>
<input type="email" id="email" name="email" required>
</div>
<br>
<div>
<label for="password">Contraseña:</label><br>
<input type="password" id="password" name="password" minlength="8" required>
<small>Mínimo 8 caracteres.</small>
</div>
</fieldset>
<br>
<fieldset>
<legend>Sobre ti</legend>
<div>
<label for="nacimiento">Fecha de nacimiento:</label><br>
<input type="date" id="nacimiento" name="nacimiento" required>
</div>
<br>
<div>
<label for="genero">Género:</label><br>
<select id="genero" name="genero">
<option value="no_binario">No binario</option>
<option value="mujer">Mujer</option>
<option value="hombre">Hombre</option>
<option value="prefiero_no_decirlo">Prefiero no decirlo</option>
</select>
</div>
<br>
<div>
<label for="foto">Foto de perfil:</label><br>
<input type="file" id="foto" name="foto" accept="image/*">
</div>
<br>
<div>
<label for="bio">Biografía corta:</label><br>
<textarea id="bio" name="bio" rows="4" cols="40" placeholder="Cuéntale al mundo quién eres..."></textarea>
</div>
</fieldset>
<br>
<div>
<input type="checkbox" id="notificaciones" name="notificaciones" checked>
<label for="notificaciones">Deseo recibir notificaciones sobre actividad relevante.</label>
</div>
<br>
<div>
<input type="checkbox" id="terminos" name="terminos" required>
<label for="terminos">Acepto los <strong>Términos de Servicio</strong> y la <strong>Política de Cookies</strong>.</label>
</div>
<br>
<button type="submit">Registrarse ahora</button>
</form>
</body>
</html>
