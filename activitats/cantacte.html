<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Contacte - El Meu Portafoli</title>
    <link rel="stylesheet" href="estil.css">
</head>
<body>
    <header>
        <h1>EL MEU PORTAFOLI</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inici</a></li>
                <li><a href="activitats html.html">HTML</a></li>
                <li><a href="activitats css.html">CSS</a></li>
                <li><a href="cantacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="formulari-seccio">
            <h2>Contacta amb mi</h2>
            <form action="#" method="post" class="formulari-contacte">
                <div class="camp">
                    <label for="nom">Nom complet:</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="camp">
                    <label for="email">Correu electrònic:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="camp">
                    <label for="missatge">Missatge:</label>
                    <textarea id="missatge" name="missatge" rows="5" required></textarea>
                </div>
                <button type="submit" class="boto-enviar">Enviar missatge</button>
            </form>
        </section>
    </main>
</body>
</html>
